name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: mv "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/MX-5 Drivers Metrics.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MX5-AndroidAuto-debug
          path: "app/build/outputs/apk/debug/MX-5 Drivers Metrics.apk"
          if-no-files-found: error
